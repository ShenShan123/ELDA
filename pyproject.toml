[build-system]
requires = ["setuptools>=68", "wheel", "Cython==3.2.4", "numpy==1.26.4"]
build-backend = "setuptools.build_meta"

[project]
name = "elda-netlist"
version = "1.0.0"
authors = [
    {name = "ELDA authors"},
]
description = "Pin-aware, state-constrained autoregressive generation of materializable gate-level subcircuits"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["EDA", "netlist generation", "transformers", "graph generation", "constrained decoding"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["elda*", "circuit_kahypar*"]
