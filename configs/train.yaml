# @package _global_
defaults:
  - _self_
  - datamodule: planar
  - experiment: planar
  - mode: default

debug: false
seed: 0
wandb: false
# Number of samples for the post-training test pass.
# Set to 0 to skip it; set to -1 only when full/balanced test sampling is intended.
final_test_num_samples: 512

datamodule:
  batch_size: 128
  pin_memory: True
  num_workers: 0
  max_length: -1
  truncation_length: 2048

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  precision: bf16-true
  max_steps: 800000
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0
  strategy: auto
  devices: auto
  default_root_dir: ${logs.path}
  num_sanity_val_steps: 0

sampling:
  num_samples: -1
  top_k: 10
  temperature: 1.0
  max_length: 2048
  batch_size: ${datamodule.batch_size}
  min_length: 0
  min_edges: 0
  min_net_tokens: 0
  net_token_target: 0
  net_token_bias: 0.0

train:
  adaptive_gradient_checkpointing: false
  adaptive_gradient_checkpointing_threshold: 16384
  optimizer:
    _target_: torch.optim.AdamW
    lr: 6e-04
    weight_decay: 0.1
    betas: [0.9, 0.95]
  grammar_mask: false
  net_token_weight: 1.0
  gate_type_reweighting: false
  gate_type_profile_path: null
  cell_mapping_path: null
  gate_type_reweight_alpha: 0.5
  gate_type_reweight_max: 3.0
  gate_type_head_min_weight: 0.75
  gate_type_downweight_x1: true
  partition_hist_aux_weight: 0.0
  partition_projection_proxy_aux_weight: 0.0
  partition_projection_components_aux_weight: 0.0
  partition_contract_aux_weight: 0.0
  skeleton_size_reweighting: false
  skeleton_meta_path: null
  skeleton_size_reweight_alpha: 0.5
  skeleton_size_reweight_scale: 0.75
  skeleton_stub_reweight_scale: 0.0
  skeleton_pin_reweight_scale: 0.0
  skeleton_quality_reweight_scale: 0.0
  skeleton_size_reweight_max: 2.5
  skeleton_large_bucket_min: 2
  skeleton_small_bucket_min_weight: 0.85
  skeleton_downweight_small: true
  skeleton_component_aux_weight: 0.0
  skeleton_connectivity_aux_weight: 0.0
  skeleton_contract_aux_weight: 0.0
  skeleton_typed_edge_aux_weight: 0.0
  lr_scheduler:
    _target_: elda.lr_schedulers.get_cosine_schedule_with_warmup
    warmup_steps: ${eval:0.01 * ${trainer.max_steps}}
    max_steps: ${eval:0.9 * ${trainer.max_steps}}
    min_factor: 0.1

model:
  _target_: elda.models.seq_models.HFSequenceModel
  model_name: llama-s
  attention_dropout: 0.0
  attn_implementation: sdpa
  pretrained_path: null

logs:
  prefix: logs/train/${datamodule.dataset_names}/${model.model_name}/${seed}
  path: ${logs.prefix}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}

# output directory, generated dynamically on each run
hydra:
  run:
    dir: ${logs.path}
  sweep:
    dir: ${logs.prefix}/multiruns/train/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
