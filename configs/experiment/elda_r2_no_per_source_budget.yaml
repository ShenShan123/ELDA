# @package _global_
defaults:
  - elda_reference
datamodule:
  root: ${oc.env:ELDA_R2_DATA_ROOT}
  dataset_names: ELDA_R2_NO_PER_SOURCE_BUDGET
  tokenizer_type: source_net_r2
