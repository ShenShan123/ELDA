[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elda-code-data-supplement"
version = "1.0.0"
description = "Portable executable supplement for endpoint-level demand assignment"
requires-python = ">=3.11,<3.12"
license = {text = "BSD-3-Clause"}
dependencies = [
  "torch==2.7.0",
  "torch-geometric==2.7.0",
  "transformers==4.57.6",
  "networkx==3.6.1",
  "numpy==1.26.4",
  "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
